services:
  - type: web
    name: duecue-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy --workspace=@duecue/backend && npm run start --workspace=@duecue/backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: clerk
      - key: EMAIL_MODE
        value: preview
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
